<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- viewport-fit=cover lets the page use the full screen; safe-area insets in index.css keep
         content clear of the notch, the home indicator and Safari's side chrome when folded. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="theme-color" content="#f7f5f0" />
    <meta name="apple-mobile-web-app-title" content="CAzen" />
    <!-- Added to the Home Screen, CAzen runs without the browser's bars — the only way to a
         genuinely full screen on an iPhone, which has long refused the Fullscreen API. -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>CAzen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
